<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .page {
    background: #dcefe2;
    border-radius: 16px;
    padding: 60px 40px;
    width: 100%;
    max-width: 520px;
  }

  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 32px 36px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    color: #1a1a1a;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .row {
    display: flex;
    gap: 16px;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 13px;
    color: #444;
    margin-bottom: 6px;
  }

  label .req {
    color: #d94f4f;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    border: 1px solid #d8d8d8;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
    width: 100%;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus {
    border-color: #0f6e56;
  }

  input.invalid,
  textarea.invalid {
    border-color: #d94f4f;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .query-options {
    display: flex;
    gap: 12px;
  }

  .query-option {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #d8d8d8;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .query-option:hover {
    border-color: #0f6e56;
  }

  .query-option input {
    accent-color: #0f6e56;
  }

  .query-option.selected {
    border-color: #0f6e56;
    background: #e1f5ee;
  }

  .consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #444;
  }

  .consent input {
    margin-top: 3px;
    accent-color: #0f6e56;
  }

  .error-text {
    font-size: 12px;
    color: #d94f4f;
    margin-top: 4px;
    display: none;
  }

  .error-text.show {
    display: block;
  }

  button[type="submit"] {
    background: #0f6e56;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease;
  }

  button[type="submit"]:hover {
    background: #0c5a46;
  }

  .success-message {
    display: none;
    text-align: center;
    padding: 20px 0;
  }

  .success-message.show {
    display: block;
  }

  .success-message h2 {
    font-size: 18px;
    color: #0f6e56;
    margin: 0 0 8px;
  }

  .success-message p {
    font-size: 14px;
    color: #555;
    margin: 0;
  }

  @media (max-width: 480px) {
    .row, .query-options {
      flex-direction: column;
    }
    .page {
      padding: 24px 16px;
    }
    .card {
      padding: 24px 20px;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <h1>Contact us</h1>

    <div class="success-message" id="successMessage">
      <h2>Thanks for reaching out</h2>
      <p>We've received your message and will get back to you soon.</p>
    </div>

    <form id="contactForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="firstName">First name <span class="req">*</span></label>
          <input type="text" id="firstName" name="firstName">
          <span class="error-text">Enter your first name.</span>
        </div>
        <div class="field">
          <label for="lastName">Last name <span class="req">*</span></label>
          <input type="text" id="lastName" name="lastName">
          <span class="error-text">Enter your last name.</span>
        </div>
      </div>

      <div class="field">
        <label for="email">Email address <span class="req">*</span></label>
        <input type="email" id="email" name="email">
        <span class="error-text">Enter a valid email address.</span>
      </div>

      <div class="field">
        <label>Query type <span class="req">*</span></label>
        <div class="query-options">
          <label class="query-option" data-option>
            <input type="radio" name="queryType" value="General enquiry">
            General enquiry
          </label>
          <label class="query-option" data-option>
            <input type="radio" name="queryType" value="Support request">
            Support request
          </label>
        </div>
        <span class="error-text" id="queryTypeError">Select a query type.</span>
      </div>

      <div class="field">
        <label for="message">Message <span class="req">*</span></label>
        <textarea id="message" name="message"></textarea>
        <span class="error-text">Enter a message.</span>
      </div>

      <label class="consent">
        <input type="checkbox" id="consent" name="consent">
        I consent to being contacted by the team <span class="req">*</span>
      </label>
      <span class="error-text" id="consentError">You must consent to be contacted.</span>

      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById('contactForm');
  const successMessage = document.getElementById('successMessage');

  // Highlight selected radio card
  document.querySelectorAll('.query-option').forEach(function (option) {
    const radio = option.querySelector('input[type="radio"]');
    radio.addEventListener('change', function () {
      document.querySelectorAll('.query-option').forEach(function (o) {
        o.classList.remove('selected');
      });
      option.classList.add('selected');
    });
  });

  function clearErrors() {
    form.querySelectorAll('.invalid').forEach(function (el) {
      el.classList.remove('invalid');
    });
    form.querySelectorAll('.error-text').forEach(function (el) {
      el.classList.remove('show');
    });
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearErrors();

    let valid = true;

    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const email = document.getElementById('email');
    const message = document.getElementById('message');
    const consent = document.getElementById('consent');
    const queryType = form.querySelector('input[name="queryType"]:checked');

    if (!firstName.value.trim()) {
      firstName.classList.add('invalid');
      firstName.nextElementSibling.classList.add('show');
      valid = false;
    }
    if (!lastName.value.trim()) {
      lastName.classList.add('invalid');
      lastName.nextElementSibling.classList.add('show');
      valid = false;
    }
    if (!isValidEmail(email.value.trim())) {
      email.classList.add('invalid');
      email.nextElementSibling.classList.add('show');
      valid = false;
    }
    if (!queryType) {
      document.getElementById('queryTypeError').classList.add('show');
      valid = false;
    }
    if (!message.value.trim()) {
      message.classList.add('invalid');
      message.nextElementSibling.classList.add('show');
      valid = false;
    }
    if (!consent.checked) {
      document.getElementById('consentError').classList.add('show');
      valid = false;
    }

    if (!valid) return;

    // Collect the data — replace this block with a real fetch() call
    // to your backend or form service (e.g. Formspree, your own API).
    const formData = {
      firstName: firstName.value.trim(),
      lastName: lastName.value.trim(),
      email: email.value.trim(),
      queryType: queryType.value,
      message: message.value.trim(),
      consent: consent.checked
    };
    console.log('Form submitted:', formData);

    form.style.display = 'none';
    successMessage.classList.add('show');
  });
</script>

</body>
</html>
